<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麗澤マッピング</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="appInfoPanel" class="app-header" aria-label="アプリ情報">
    <button id="hideInfoPanel" class="panel-hide-button" type="button" aria-controls="appInfoPanel" aria-expanded="true">隠す</button>
    <div>
      <h1>麗澤マッピング</h1>
      <p>地図をクリックして、その場所に付箋メモを貼れます。</p>
    </div>
    <div class="header-actions">
      <div class="note-count" aria-live="polite">
        <span id="noteCount">0</span>
        <span>枚</span>
      </div>
      <button id="resetNotes" class="reset-button" type="button">リセット</button>
    </div>
  </header>
  <button id="showInfoPanel" class="panel-show-button" type="button" aria-controls="appInfoPanel" aria-expanded="false" hidden>i</button>

  <main class="map-shell">
    <div id="map" aria-label="麗澤大学周辺の付箋マップ"></div>
  </main>

  <template id="noteFormTemplate">
    <form class="sticky-form">
      <label for="noteText">この場所のメモ</label>
      <textarea id="noteText" name="noteText" maxlength="80" rows="4" placeholder="例: 静かに話せる場所"></textarea>
      <div class="type-field">
        <label for="noteType">種類</label>
        <select id="noteType" name="noteType">
          <option value="発見">発見</option>
          <option value="おすすめ">おすすめ</option>
          <option value="注意">注意</option>
          <option value="休憩">休憩</option>
        </select>
      </div>
      <div class="image-field">
        <span class="image-field-label">写真を撮る / 選ぶ</span>
        <p class="image-field-help">スマホでは撮影、PCでは画像ファイル選択が使えます。</p>
        <div class="image-action-row">
          <label class="image-action-button">
            写真を撮る
            <input class="image-action-input" data-image-input name="noteCameraImage" type="file" accept="image/*" capture="environment">
          </label>
          <label class="image-action-button">
            写真を選ぶ
            <input class="image-action-input" data-image-input name="noteImage" type="file" accept="image/*">
          </label>
        </div>
        <div class="image-preview" data-image-preview hidden>
          <img src="" alt="選択した写真のプレビュー">
        </div>
        <button type="button" class="ghost-button image-remove-button" data-action="remove-image" hidden>写真を削除</button>
      </div>
      <div class="form-actions">
        <button type="button" class="ghost-button" data-action="cancel">閉じる</button>
        <button type="submit" class="primary-button">保存</button>
      </div>
    </form>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js" charset="UTF-8"></script>
</body>
</html>
